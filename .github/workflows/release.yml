# Continuous delivery: push a semver tag (vX.Y.Z) to publish release binaries
# for Linux (x86_64/aarch64), macOS (x86_64/aarch64), and Windows (x86_64) as
# GitHub Release assets. Cross-target builds are handled by the action (zigbuild
# for aarch64-linux, native toolchains elsewhere).

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and upload binaries to GitHub Release
        uses: taiki-e/upload-rust-binary-action@v2
        with:
          bin: hawk
          target: ${{ matrix.target }}
          archive: hawk-$target
          token: ${{ secrets.GITHUB_TOKEN }}
