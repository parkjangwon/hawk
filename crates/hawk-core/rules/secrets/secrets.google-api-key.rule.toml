id = "secrets.google-api-key"
name = "Google API key in source"
description = "A Google API key (AIza…) embedded in source code can be extracted and abused against the linked Google Cloud project, incurring cost and data exposure."
recommendation = "Rotate the key in the Google Cloud console, restrict it by API and referrer, and load it from environment variables or a secrets manager."
category = "secrets"
severity = "high"
confidence = "high"
languages = ["java", "javascript", "typescript", "python", "go"]
cwe = "CWE-798"
owasp = "A07:2021"

[pattern]
regex = "AIza[0-9A-Za-z_\\-]{35}"
