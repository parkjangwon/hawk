id = "secrets.private-key-block"
name = "Private key material in source"
description = "A PEM private key block committed to source code hands over the identity it signs for: SSH keys, TLS keys, code-signing keys, and PGP keys all belong in secret storage."
recommendation = "Remove the key from version control history (it must be treated as compromised), rotate it, and load it from a secrets manager or encrypted key store at runtime."
category = "secrets"
severity = "critical"
confidence = "high"
languages = ["java", "javascript", "typescript", "python", "go"]
cwe = "CWE-321"
owasp = "A02:2021"

[pattern]
regex = "-----BEGIN (RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY( BLOCK)?-----"
