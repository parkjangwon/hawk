id = "secrets.slack-token"
name = "Slack token in source"
description = "A Slack bot/user/app token (xoxb-/xoxp-/xoxa-) committed to source code exposes workspace access to anyone with repository read access."
recommendation = "Revoke the token in the Slack app settings and issue a new one, stored in environment variables or a secrets manager."
category = "secrets"
severity = "high"
confidence = "high"
languages = ["java", "javascript", "typescript", "python", "go"]
cwe = "CWE-798"
owasp = "A07:2021"

[pattern]
regex = "xox[baprs]-[0-9A-Za-z\\-]{10,}"
