id = "secrets.github-token"
name = "GitHub token in source"
description = "A GitHub token (ghp_/gho_/ghu_/ghs_/ghr_) committed to source code exposes the repositories and actions its scopes allow."
recommendation = "Revoke the token in GitHub settings, then authenticate from environment variables or a CI secret store instead of source code."
category = "secrets"
severity = "high"
confidence = "high"
languages = ["java", "javascript", "typescript", "python", "go"]
cwe = "CWE-798"
owasp = "A07:2021"

[pattern]
regex = "gh[pousr]_[A-Za-z0-9]{36,}"
