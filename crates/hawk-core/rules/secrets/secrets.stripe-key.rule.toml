id = "secrets.stripe-key"
name = "Stripe secret key in source"
description = "A Stripe secret or restricted key (sk_/rk_) committed to source code lets anyone read and mutate payment data on the account."
recommendation = "Roll the key in the Stripe dashboard, keep it in environment variables or a secrets manager, and restrict restricted keys to their narrowest scopes."
category = "secrets"
severity = "critical"
confidence = "high"
languages = ["java", "javascript", "typescript", "python", "go"]
cwe = "CWE-798"
owasp = "A07:2021"

[pattern]
regex = "(sk|rk)_(live|test)_[0-9a-zA-Z]{24,}"
