id = "secrets.aws-access-key"
name = "AWS access key id in source"
description = "An AWS access key id committed to source code grants whoever sees the repository access to the linked AWS account until the key is rotated."
recommendation = "Revoke the key in IAM immediately if it was committed, then load credentials from environment variables, an AWS credentials file, or a secrets manager — never from source."
category = "secrets"
severity = "high"
confidence = "high"
languages = ["java", "javascript", "typescript", "python", "go"]
cwe = "CWE-798"
owasp = "A07:2021"

[pattern]
regex = "(AKIA|ASIA)[0-9A-Z]{16}"
