id = "secrets.generic-credential"
name = "Generic credential-like assignment"
description = "A long opaque string assigned to a credential-shaped name (api key, secret key, access token, client secret, auth token) is usually a live secret committed to source."
recommendation = "Keep the value in an environment variable or secrets manager and load it at runtime; add the name to an allowlist if the assignment is provably a dummy."
category = "secrets"
severity = "high"
confidence = "medium"
languages = ["java", "javascript", "typescript", "python", "go"]
cwe = "CWE-798"
owasp = "A07:2021"

[pattern]
regex = "(?i)(api[_\\-]?key|secret[_\\-]?key|access[_\\-]?token|client[_\\-]?secret|auth[_\\-]?token)\\s*[:=]\\s*[\"'][A-Za-z0-9+/_\\-=]{20,}[\"']"
not-regex = "(?i)(placeholder|example|dummy|changeme|sample|your[_\\-]|<[^>]*>|\\$\\{|\\{\\{)"
