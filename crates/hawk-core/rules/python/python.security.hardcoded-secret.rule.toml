id = "python.security.hardcoded-secret"
name = "Hardcoded password or secret token"
description = "Hardcoded credentials in Python files can be leaked via version control or decompilation."
recommendation = "Load credentials from environment variables using os.environ or a secret vault."
category = "secrets"
severity = "high"
confidence = "medium"
languages = ["python"]
cwe = "CWE-798"
owasp = "A07:2021"

[pattern]
regex = "(?i)(password|passwd|secret|api[_\\-]?key|auth[_\\-]?token)\\s*=\\s*['\"][A-Za-z0-9_\\-+=]{8,}['\"]"
not_regex = "(?i)(placeholder|example|test|default|dummy|changeme|TODO)"
