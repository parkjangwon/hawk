id = "python.security.ssrf"
name = "Server-side request forgery"
description = "HTTP requests to URLs built from request data can reach internal networks and cloud metadata endpoints (SSRF)."
recommendation = "Allowlist target hosts/schemes; block internal and metadata address ranges; never forward raw user URLs."
category = "ssrf"
severity = "high"
confidence = "medium"
languages = ["python"]
cwe = "CWE-918"
owasp = "A10:2021"

[taint]
sources = ["request.args", "request.POST", "request.GET", "request.form", "request.values", "request.json", "request.cookies", "request.files", "request.data", "request.headers", "request.COOKIES", "request.META", "getParameter"]
sanitizers = ["urlparse", "isSafeUrl", "isSafeHost"]
sinks = ["urllib.request.urlopen(", "urllib.request.Request(", "requests.get(", "requests.post(", "requests.put(", "requests.delete(", "requests.request(", "httpx.get(", "httpx.post(", "httpx.request(", "aiohttp.ClientSession"]