id = "javascript.security.hardcoded-jwt-secret"
name = "Hardcoded JWT secret"
description = "Signing or verifying JWT tokens with a hardcoded string literal allows attackers to forge authorization tokens."
recommendation = "Load the JWT secret key from environment variables (process.env.JWT_SECRET)."
category = "secrets"
severity = "high"
confidence = "medium"
languages = ["javascript", "typescript"]
cwe = "CWE-798"
owasp = "A07:2021"

[pattern]
regex = "jwt\\.(sign|verify)\\s*\\([^,]+,\\s*['\"][^'\"]{6,}['\"]"
not_regex = "jwt\\.(sign|verify)\\s*\\([^,]+,\\s*['\"](test|secret|dummy|example)['\"]"
