id = "go.security.hardcoded-credentials"
name = "Hardcoded password or secret token"
description = "Hardcoded credentials in source code can be extracted and lead to unauthorized access. Store secrets in environment variables or a secrets manager."
recommendation = "Read credentials from environment variables (os.Getenv) or secure key vaults."
category = "secrets"
severity = "high"
confidence = "medium"
languages = ["go"]
cwe = "CWE-798"
owasp = "A07:2021"

[pattern]
regex = "(?i)(password|passwd|secret|api[_\\-]?key|token)\\s*(:=|=)\\s*\"[A-Za-z0-9_\\-+=]{8,}\""
not_regex = "(?i)(placeholder|example|test|default|dummy|changeme|TODO)"
