id = "go.security.sql-injection"
name = "SQL injection via dynamic query"
description = "Concatenating external input (FormValue, URL query) into a database/sql query without validation enables SQL injection."
recommendation = "Use parameter placeholders (?) with db.Query/QueryRow/Exec and bind the input instead of concatenating it."
category = "sql-injection"
severity = "critical"
confidence = "medium"
languages = ["go"]
cwe = "CWE-89"
owasp = "A03:2021"

[taint]
sources = ["FormValue", "URL.Query().Get", "URL.Query()", "Form.Get"]
sanitizers = ["sanitizeSql"]
sinks = ["db.Query(", "db.QueryRow(", "db.Exec(", "conn.Query(", "conn.Exec(", "tx.Exec(", "stmt.Exec(", ".QueryContext(", ".ExecContext("]