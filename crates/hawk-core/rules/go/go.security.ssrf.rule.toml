id = "go.security.ssrf"
name = "Server-side request forgery"
description = "외부 입력으로 만든 URL을 net/http로 요청하면 내부망·메타데이터 접근이 가능하다."
recommendation = "요청 대상 호스트·스킴을 화이트리스트로 제한하고 내부 주소를 차단한다."
category = "ssrf"
severity = "high"
confidence = "medium"
languages = ["go"]
cwe = "CWE-918"
owasp = "A10:2021"

[taint]
sources = ["FormValue", "URL.Query().Get", "URL.Query()", "Form.Get"]
sanitizers = ["isAllowedHost"]
sinks = ["http.Get(", "http.Post(", "http.NewRequest(", "client.Do(", "client.Get("]