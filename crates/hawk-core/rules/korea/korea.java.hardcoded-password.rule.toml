id = "korea.java.hardcoded-password"
name = "Hardcoded password"
description = "Passwords and credentials embedded in source code are exposed to anyone with repository access. Korean secure-coding guidance requires externalizing credentials."
recommendation = "Store credentials in environment variables, secret managers, or encrypted configuration; never commit them to source."
category = "hardcoded-credentials"
severity = "high"
confidence = "high"
languages = ["java"]
cwe = "CWE-798"
owasp = "A07:2021"

[pattern]
regex = "password\\s*=\\s*[\"'][^\"']+[\"']|secretKey\\s*=\\s*[\"'][^\"']+[\"']"