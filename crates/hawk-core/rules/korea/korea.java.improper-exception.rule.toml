id = "korea.java.improper-exception"
name = "Improper exception handling"
description = "에러처리 - 부적절한 예외 처리(라-3): 예외를 삼키는 빈 catch 블록은 오류 상황을 숨겨 장애 원인 파악을 어렵게 한다."
recommendation = "예외를 적절히 로깅하고 복구하거나 상위로 전파한다. 빈 catch 블록을 금지한다."
category = "error-handling"
severity = "low"
confidence = "high"
languages = ["java"]
cwe = "CWE-390"
owasp = "A04:2021"

[pattern]
regex = "catch\\s*\\(\\s*(Exception|Throwable)\\s+\\w+\\s*\\)\\s*\\{\\s*\\}"