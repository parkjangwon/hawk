id = "korea.java.code-injection"
name = "Code injection via script engine"
description = "입력데이터 검증 및 표현 - 코드 삽입(가-2): 외부 입력을 스크립트 엔진(ScriptEngine)으로 실행하면 임의 코드가 실행될 수 있다."
recommendation = "스크립트 엔진 사용 시 외부 입력을 코드로 평가하지 않도록 하고, 입력값을 사전 검증한다."
category = "code-injection"
severity = "critical"
confidence = "medium"
languages = ["java"]
cwe = "CWE-94"
owasp = "A03:2021"

[pattern]
regex = "ScriptEngine[^;]{0,120}?eval\\s*\\(|eval\\s*\\([^)]*(getParameter|getHeader|request\\.)"