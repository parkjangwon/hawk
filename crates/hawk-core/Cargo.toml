[package]
name = "hawk-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "hawk_core"
path = "src/lib.rs"

[dependencies]
tree-sitter = "0.20.10"
tree-sitter-java = "0.20.2"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
once_cell = "1.19"
